<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Questions to keep the claims proportional to the evidence</title><desc>Concise answers to likely defense questions.</desc><rect width="1600" height="900" fill="#F5F7FB"/><rect x="70" y="30" width="440.8125" height="36" rx="18" fill="#E3F2F1" stroke="#E3F2F1"/><text x="85" y="54.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">BACKUP · OUTSIDE THE 15-MINUTE TALK</text><text x="70" y="115" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">Questions to keep the claims proportional to the evidence</text><rect x="70" y="235" width="705" height="205" rx="22" fill="white" stroke="#DCE5EF"/><rect x="95" y="263" width="7" height="45" rx="3" fill="#007F86" stroke="#007F86"/><text x="120" y="296.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Why “Generalizable”?</text><text x="100" y="350" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">It is a research objective. Current evidence is</text><text x="100" y="386" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">stronger for supervised personalization.</text><rect x="825" y="235" width="705" height="205" rx="22" fill="white" stroke="#DCE5EF"/><rect x="850" y="263" width="7" height="45" rx="3" fill="#D99A24" stroke="#D99A24"/><text x="875" y="296.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Does two seconds mean total</text><text x="875" y="335.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">calibration?</text><text x="855" y="389" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">No. Optical context, capture, QC, and functional</text><text x="855" y="425" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">calibration are additional.</text><rect x="70" y="475" width="705" height="205" rx="22" fill="white" stroke="#DCE5EF"/><rect x="95" y="503" width="7" height="45" rx="3" fill="#D99A24" stroke="#D99A24"/><text x="120" y="536.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Does augmentation solve</text><text x="120" y="575.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">remounting?</text><text x="100" y="629" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Only synthetic coordinate changes were tested;</text><text x="100" y="665" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">actual remounting was not.</text><rect x="825" y="475" width="705" height="205" rx="22" fill="white" stroke="#DCE5EF"/><rect x="850" y="503" width="7" height="45" rx="3" fill="#007F86" stroke="#007F86"/><text x="875" y="536.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">What is the next evidence priority?</text><text x="855" y="590" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Explain cross-condition retention and obtain more</text><text x="855" y="626" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">independent public stroke evidence.</text><line x1="70" y1="826" x2="1530" y2="826" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="865.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">YINCHENG WANG · MIDTERM DEFENSE · 27 OCTOBER 2026</text><text x="1530" y="865.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="end">A4</text></svg>
