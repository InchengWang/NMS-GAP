<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>The current contribution is an auditable study of personalization and its limits</title><desc>Personalization is supported; clinical coordinates, independent stroke validation, and deployment remain open.</desc><rect width="1600" height="900" fill="#F5F7FB"/><text x="70" y="49.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">CONTRIBUTIONS AND LIMITATIONS</text><text x="1530" y="49.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="end">01:15  /  planned</text><text x="70" y="108" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">The current contribution is an auditable study of</text><text x="70" y="160" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">personalization and its limits</text><rect x="70" y="235" width="910" height="135" rx="22" fill="white" stroke="#DCE5EF"/><text x="95" y="282.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">01</text><text x="160" y="282.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Reliable data lineage</text><text x="160" y="328.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Measured inputs, ordered pairing, explicit QC</text><rect x="1015" y="235" width="515" height="135" rx="22" fill="#EDF1F6" stroke="#EDF1F6"/><text x="1042" y="283" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Small stroke cohort; offline</text><text x="1042" y="316" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">reference exposure</text><rect x="70" y="390" width="910" height="135" rx="22" fill="white" stroke="#DCE5EF"/><text x="95" y="437.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">02</text><text x="160" y="437.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Patient-level personalization evidence</text><text x="160" y="483.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">G / I / A and matched target-reference budgets</text><rect x="1015" y="390" width="515" height="135" rx="22" fill="#EDF1F6" stroke="#EDF1F6"/><text x="1042" y="438" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Engineering labels; limited</text><text x="1042" y="471" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">independent stroke evidence</text><rect x="70" y="545" width="910" height="135" rx="22" fill="white" stroke="#DCE5EF"/><text x="95" y="592.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">03</text><text x="160" y="592.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Condition and robustness analysis</text><text x="160" y="638.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Budget curves, public pilots, and negative results</text><rect x="1015" y="545" width="515" height="135" rx="22" fill="#EDF1F6" stroke="#EDF1F6"/><text x="1042" y="593" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Offline reconstruction; no true</text><text x="1042" y="626" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">remount test</text><rect x="70" y="736" width="1460" height="78" rx="18" fill="#E8F2F3" stroke="#E8F2F3"/><text x="94" y="767" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Personalization is supported; clinical coordinates, independent stroke validation, and deployment</text><text x="94" y="798" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">remain open.</text><text x="70" y="842.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">[E1]  [E3]  [E4]  [E5]  [E6]  |  References and evidence links accompany each slide.</text><line x1="70" y1="852" x2="1530" y2="852" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">YINCHENG WANG  ·  TOHOKU UNIVERSITY  ·  ROBOTICS</text><text x="800" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">27 OCTOBER 2026</text><text x="1530" y="878.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">13 / 14</text></svg>
