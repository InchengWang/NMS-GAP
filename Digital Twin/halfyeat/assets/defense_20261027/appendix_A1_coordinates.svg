<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Coordinates and output definitions</title><desc>Dataset-specific coordinates and engineering labels.</desc><rect width="1600" height="900" fill="#F5F7FB"/><rect x="70" y="30" width="440.8125" height="36" rx="18" fill="#E3F2F1" stroke="#E3F2F1"/><text x="85" y="54.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">BACKUP · OUTSIDE THE 15-MINUTE TALK</text><text x="70" y="115" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">Coordinates and output definitions</text><rect x="70" y="230" width="705" height="430" rx="22" fill="white" stroke="#DCE5EF"/><rect x="95" y="258" width="7" height="45" rx="3" fill="#007F86" stroke="#007F86"/><text x="120" y="291.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Stroke engineering labels</text><text x="100" y="345" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Candidate pelvis: X right, Y forward, Z up</text><text x="100" y="381" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Sagittal YZ · frontal XZ · horizontal XY</text><text x="100" y="417" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Six legacy projections; knees use absolute values</text><text x="100" y="453" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Not a certified clinical JCS</text><rect x="825" y="230" width="705" height="430" rx="22" fill="white" stroke="#DCE5EF"/><rect x="850" y="258" width="7" height="45" rx="3" fill="#D99A24" stroke="#D99A24"/><text x="875" y="291.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">Dorschky optical proxy</text><text x="855" y="345" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Per-trial forward + world up</text><text x="855" y="381" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">World-up Y; heading lies in world XZ</text><text x="855" y="417" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Two signed flexion-positive knee proxies</text><text x="855" y="453" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">No frontal / transverse output</text><text x="70" y="740.0" fill="#B95243" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">Sensor xyz axes are not anatomical planes. Coordinate conventions differ by dataset.</text><line x1="70" y1="826" x2="1530" y2="826" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="865.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">YINCHENG WANG · MIDTERM DEFENSE · 27 OCTOBER 2026</text><text x="1530" y="865.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="end">A1</text></svg>
