ecific FrameTCN</text><text x="605" y="486.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start">Bilateral-knee RMSE</text><rect x="1070" y="245" width="460" height="345" rx="22" fill="white" stroke="#DCE5EF"/><text x="1105" y="350.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="66" font-weight="700" text-anchor="start">6</text><text x="1105" y="420.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Test patients</text><text x="1105" y="486.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start">10 held-out trials</text><text x="95" y="655.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Stroke cohort  ·  3 seeds  ·  Patient-specific TRAIN and VALID</text><rect x="70" y="736" width="1460" height="78" rx="18" fill="#E8F2F3" stroke="#E8F2F3"/><text x="94" y="767" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Patient-specific reconstruction is feasible on the accepted data; this is not cross-patient transfer.</text><text x="70" y="842.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">[E1]  |  References and evidence links accompany each slide.</text><line x1="70" y1="852" x2="1530" y2="852" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">YINCHENG WANG  ·  TOHOKU UNIVERSITY  ·  ROBOTICS</text><text x="800" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">27 OCTOBER 2026</text><text x="1530" y="878.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-siz