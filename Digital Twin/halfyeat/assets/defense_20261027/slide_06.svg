<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Reliable pairing is a prerequisite for a meaningful learning result</title><desc>The accepted engineering cohort contains 53 trials from 8 patients, with explicit exclusions.</desc><rect width="1600" height="900" fill="#F5F7FB"/><text x="70" y="49.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">DATA AND RELIABILITY</text><text x="1530" y="49.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="end">01:15  /  planned</text><text x="70" y="108" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">Reliable pairing is a prerequisite for a meaningful learning</text><text x="70" y="160" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">result</text><rect x="70" y="235" width="405" height="460" rx="22" fill="white" stroke="#DCE5EF"/><text x="100" y="285.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">Six-sensor acquisition</text><text x="100" y="345.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">S1 / S2</text><text x="260" y="345.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Left / right</text><text x="260" y="374.9" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">shanks</text><text x="100" y="410.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">S3</text><text x="260" y="410.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Waist</text><text x="100" y="475.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">S4 / S5</text><text x="260" y="475.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Left / right feet</text><text x="100" y="540.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">S6</text><text x="260" y="540.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Cane</text><rect x="100" y="620" width="261.109375" height="36" rx="18" fill="#E3F2F1" stroke="#E3F2F1"/><text x="115" y="644.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">MODEL INPUT: S1 + S2</text><rect x="525" y="235" width="1005" height="112" rx="22" fill="white" stroke="#DCE5EF"/><text x="550" y="278.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start">01</text><text x="617" y="277.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">Preparation markers</text><text x="617" y="317.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Repeated unaffected-leg lifts before walking</text><rect x="525" y="367" width="1005" height="112" rx="22" fill="white" stroke="#DCE5EF"/><text x="550" y="410.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start">02</text><text x="617" y="409.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">Ordered matching</text><text x="617" y="449.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Allow missing / skipped optical segments</text><rect x="525" y="499" width="1005" height="112" rx="22" fill="white" stroke="#DCE5EF"/><text x="550" y="542.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start">03</text><text x="617" y="541.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">Physical and support checks</text><text x="617" y="581.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Keep declared exclusions and unresolved records</text><text x="550" y="683.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">69 target records  →  53 accepted trials  /  8 patients</text><rect x="70" y="736" width="1460" height="78" rx="18" fill="#E8F2F3" stroke="#E8F2F3"/><text x="94" y="767" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">The accepted engineering cohort contains 53 trials from 8 patients, with explicit exclusions.</text><text x="70" y="842.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">[E1]  [E2]  |  References and evidence links accompany each slide.</text><line x1="70" y1="852" x2="1530" y2="852" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">YINCHENG WANG  ·  TOHOKU UNIVERSITY  ·  ROBOTICS</text><text x="800" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">27 OCTOBER 2026</text><text x="1530" y="878.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">06 / 14</text></svg>
