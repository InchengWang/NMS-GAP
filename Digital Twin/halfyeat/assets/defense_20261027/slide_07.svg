<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Keep the network fixed and make the evaluation roles explicit</title><desc>Split complete trials before windowing, and charge all reference information to its role.</desc><rect width="1600" height="900" fill="#F5F7FB"/><text x="70" y="49.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">METHOD AND PROTOCOL</text><text x="1530" y="49.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="end">01:15  /  planned</text><text x="70" y="108" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">Keep the network fixed and make the evaluation roles</text><text x="70" y="160" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">explicit</text><rect x="70" y="245" width="320" height="150" rx="22" fill="white" stroke="#DCE5EF"/><text x="93" y="296.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Measured inputs</text><text x="93" y="350.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">12 ACC / GYRO channels</text><line x1="400" y1="320" x2="435" y2="320" stroke="#007F86" stroke-width="4" stroke-linecap="round"/><path d="M424.4690092573155,325.75310646325045 L435,320 L424.4690092573155,314.24689353674955" fill="none" stroke="#007F86" stroke-width="4"/><rect x="450" y="245" width="320" height="150" rx="22" fill="white" stroke="#DCE5EF"/><text x="473" y="296.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Scaling / windows</text><text x="473" y="350.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">Declared TRAIN support</text><line x1="780" y1="320" x2="815" y2="320" stroke="#007F86" stroke-width="4" stroke-linecap="round"/><path d="M804.4690092573155,325.75310646325045 L815,320 L804.4690092573155,314.24689353674955" fill="none" stroke="#007F86" stroke-width="4"/><rect x="830" y="245" width="320" height="150" rx="22" fill="white" stroke="#DCE5EF"/><text x="853" y="296.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Fixed FrameTCN</text><text x="853" y="350.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">Framewise prediction</text><line x1="1160" y1="320" x2="1195" y2="320" stroke="#007F86" stroke-width="4" stroke-linecap="round"/><path d="M1184.4690092573155,325.75310646325045 L1195,320 L1184.4690092573155,314.24689353674955" fill="none" stroke="#007F86" stroke-width="4"/><rect x="1210" y="245" width="320" height="150" rx="22" fill="white" stroke="#DCE5EF"/><text x="1233" y="296.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Six output angles</text><text x="1233" y="350.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">Bilateral hip / knee /</text><text x="1233" y="378.6" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">ankle</text><rect x="70" y="450" width="460" height="210" rx="22" fill="white" stroke="#DCE5EF"/><rect x="95" y="478" width="7" height="45" rx="3" fill="#142B45" stroke="#142B45"/><text x="120" y="511.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">SOURCE</text><text x="100" y="565" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Other patients only</text><text x="100" y="601" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Target excluded from scaling</text><text x="100" y="637" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">and selection</text><rect x="570" y="450" width="460" height="210" rx="22" fill="white" stroke="#DCE5EF"/><rect x="595" y="478" width="7" height="45" rx="3" fill="#007F86" stroke="#007F86"/><text x="620" y="511.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">TARGET TRAIN</text><text x="600" y="565" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Limited paired reference</text><text x="600" y="601" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Adapt A / train random-weight I</text><rect x="1070" y="450" width="460" height="210" rx="22" fill="white" stroke="#DCE5EF"/><rect x="1095" y="478" width="7" height="45" rx="3" fill="#D99A24" stroke="#D99A24"/><text x="1120" y="511.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">TARGET EVALUATION</text><text x="1100" y="565" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Other complete trials</text><text x="1100" y="601" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Windowing follows trial</text><text x="1100" y="637" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">assignment</text><text x="80" y="704.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Stroke GEN1/2: target VALID selects checkpoints. Public pilots: fixed final target epoch.</text><rect x="70" y="736" width="1460" height="78" rx="18" fill="#E8F2F3" stroke="#E8F2F3"/><text x="94" y="767" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Split complete trials before windowing, and charge all reference information to its role.</text><text x="70" y="842.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">[E1]  [E3]  [E5]  [E6]  |  References and evidence links accompany each slide.</text><line x1="70" y1="852" x2="1530" y2="852" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">YINCHENG WANG  ·  TOHOKU UNIVERSITY  ·  ROBOTICS</text><text x="800" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">27 OCTOBER 2026</text><text x="1530" y="878.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">07 / 14</text></svg>
