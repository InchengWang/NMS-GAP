<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Sparse wearable sensing trades measurement coverage for convenience</title><desc>Two shank IMUs provide measured inputs; optical motion capture provides the reference.</desc><rect width="1600" height="900" fill="#F5F7FB"/><text x="70" y="49.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">BACKGROUND</text><text x="1530" y="49.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="end">00:55  /  planned</text><text x="70" y="108" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">Sparse wearable sensing trades measurement coverage for</text><text x="70" y="160" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" text-anchor="start">convenience</text><rect x="70" y="235" width="705" height="450" rx="22" fill="white" stroke="#DCE5EF"/><rect x="825" y="235" width="705" height="450" rx="22" fill="white" stroke="#DCE5EF"/><text x="105" y="288.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start">Optical motion capture</text><text x="860" y="288.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start">Sparse wearable IMUs</text><rect x="113" y="330" width="118" height="75" rx="10" fill="#142B45" stroke="#142B45"/><path d="M231,347 L282,322 L282,414 L231,389 Z" fill="#007F86"/><text x="320" y="354.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">External reference</text><text x="320" y="395.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Markers and a prepared setting</text><text x="105" y="490" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start">Reference for training, adaptation,</text><text x="105" y="530" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start">and evaluation.</text><text x="105" y="600.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Reference preparation has a cost.</text><rect x="867" y="335" width="65" height="82" rx="12" fill="#007F86" stroke="#007F86"/><rect x="952" y="335" width="65" height="82" rx="12" fill="#D99A24" stroke="#D99A24"/><text x="1050" y="359.0" fill="#007F86" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">2 sensors / 12 channels</text><text x="1050" y="400.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">ACC xyz + GYRO xyz, each side</text><text x="860" y="490" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start">Unobserved segments must be</text><text x="860" y="530" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start">reconstructed from limited inputs.</text><text x="860" y="600.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Current workflow includes offline optical QC.</text><rect x="70" y="736" width="1460" height="78" rx="18" fill="#E8F2F3" stroke="#E8F2F3"/><text x="94" y="767" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Two shank IMUs provide measured inputs; optical motion capture provides the reference.</text><text x="70" y="842.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">[R3]  [E1]  |  References and evidence links accompany each slide.</text><line x1="70" y1="852" x2="1530" y2="852" stroke="#DCE5EF" stroke-width="3" stroke-linecap="round"/><text x="70" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">YINCHENG WANG  ·  TOHOKU UNIVERSITY  ·  ROBOTICS</text><text x="800" y="878.0" fill="#60748A" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">27 OCTOBER 2026</text><text x="1530" y="878.0" fill="#142B45" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">03 / 14</text></svg>
